<text x="140" y="371.7" font-family="Varela Round" font-size="42" fill="#3b2618">Nachdem Nina Mats vor den Geistern</text><text x="140" y="431.4" font-family="Varela Round" font-size="42" fill="#3b2618">gerettet hat, wartet schon das nächste</text><text x="140" y="491" font-family="Varela Round" font-size="42" fill="#3b2618">Abenteuer: den Weg nach Hause finden.</text><text x="140" y="550.6" font-family="Varela Round" font-size="42" fill="#3b2618">Doch das ist schwieriger als gedacht – bald</text><text x="140" y="610.3" font-family="Varela Round" font-size="42" fill="#3b2618">wird es dunkel, und außerdem sprießen</text><text x="140" y="669.9" font-family="Varela Round" font-size="42" fill="#3b2618">überall diese Pilze aus dem Boden …</text>
